[package]
name = "dfm"
version = "2.0.0"
edition = "2021"
authors = ["Rezanur <rezanurbinshamim@gmail.com>"]
description = "DFM (Download Fast Manager) - 100% Pure Rust Internet Download Manager"

[[bin]]
name = "DFM"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
minreq = { version = "2.14", features = ["https-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
arboard = "3.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
